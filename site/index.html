<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FCFCFD">
  <title>AssetWise · ข่าววงการ AI</title>
  <meta name="description" content="รวมข่าววงการ AI จากหลายแหล่ง สรุปเป็นภาษาไทยด้วย Gemini อัปเดตอัตโนมัติ">
  <link rel="icon" href="assets/icon-512.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="assets/assetwise-logo.png" alt="AssetWise" class="brand-logo">
        <span class="brand-tag">AI News</span>
      </div>
      <div class="topbar-gap"></div>
      <span id="updated" class="updated" aria-live="polite"></span>
      <button id="reload" class="btn btn-ghost btn-icon" type="button" aria-label="โหลดข่าวล่าสุด" title="โหลดข่าวล่าสุด">
        <svg viewBox="0 0 24 24" class="icon"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
    </div>
  </header>

  <main class="main">
    <div class="page-title">
      <div>
        <h1>ข่าววงการ AI</h1>
        <p id="subtitle" class="muted">รวมข่าวจากหลายแหล่ง สรุปเป็นภาษาไทยด้วย Gemini</p>
      </div>
    </div>

    <div id="alert"></div>

    <section id="digest" class="card digest" hidden></section>

    <div class="layout">
      <div class="feed-col">
        <div class="toolbar">
          <label class="search">
            <svg viewBox="0 0 24 24" class="icon"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="q" type="search" placeholder="ค้นหาข่าว บริษัท หรือชื่อโมเดล" aria-label="ค้นหาข่าว" autocomplete="off">
          </label>
          <div class="segmented" role="group" aria-label="เรียงข่าว">
            <button type="button" data-sort="latest" aria-pressed="true">ล่าสุด</button>
            <button type="button" data-sort="important" aria-pressed="false">สำคัญสุด</button>
          </div>
          <label class="check">
            <input id="imp" type="checkbox"> เฉพาะข่าวสำคัญ
          </label>
        </div>
        <div id="cats" class="chips" role="group" aria-label="หมวดข่าว"></div>
        <div id="active-filter"></div>
        <div id="feed" class="feed" aria-live="polite"></div>
        <div id="more" class="more"></div>
      </div>

      <aside class="side">
        <details id="side-details">
          <summary>บริษัทและแหล่งข่าว</summary>
          <section class="card side-card">
            <h2 class="section-title">บริษัทที่ถูกพูดถึง</h2>
            <p class="hint">ใน 14 วันล่าสุด กดเพื่อกรอง</p>
            <div id="companies" class="company-list"></div>
          </section>
          <section class="card side-card">
            <h2 class="section-title">แหล่งข่าว</h2>
            <p class="hint">สถานะการดึงรอบล่าสุด</p>
            <ul id="sources" class="source-list"></ul>
          </section>
        </details>
      </aside>
    </div>
  </main>

  <footer class="footer">
    สรุปโดย AI อาจคลาดเคลื่อน ตรวจสอบกับต้นฉบับก่อนนำไปใช้ · <span id="model"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
